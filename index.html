<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The body and heading faces used above the fold on every route (Lighthouse perf-1):
         preloaded so the browser fetches them alongside the JS/CSS instead of discovering them
         only after the stylesheet is parsed. -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/manrope-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/archivo-latin-wdth-normal.woff2" crossorigin />
    <!--
      The app has no dark theme, so both schemes point at the same paper header colour (#FFFFFF).
      Two metas (rather than one) so a future dark surface only needs a new hex here, not a
      media-query restructure.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FFFFFF" />
    <meta name="description" content="Every room we've made ours." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Our Suites" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Suite Nothings</title>
